# 示例插件：nginx 显示一个网页，向登录的人问好。照着 README 的“写插件”换成你的应用。
services:
  web:
    # 镜像按摘要固定（多架构镜像写清单列表的摘要），标签只给人看。
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    environment:
      # 网关代登录：SSI 回显的 Remote-User 只信核心带来的。官方镜像启动时对 templates 目录里的
      # *.template 做 envsubst，把下面的地址换进 nginx 配置（见 web/default.conf.template）。
      WONTON_CORE_ADDRESS: ${WONTON_CORE_ADDRESS}
    # 包里的文件经 configs 交给容器（核心在启动前写进去），不能用卷挂载。
    configs:
      - source: site
        target: /etc/nginx/templates/default.conf.template
      - source: page
        target: /usr/share/nginx/html/index.html
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  site:
    file: web/default.conf.template
  page:
    file: web/index.html

x-wonton:
  spec: "0.4"
  # 换成你自己的：反向域名形式，装上以后不能改。
  id: app.example.hello
  version: 0.1.0
  kind: app
  title: { zh: 你好, en: Hello }
  description: { zh: 向登录的人问好的示例网页, en: An example page that greets whoever is signed in }
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: Example }
  homepage: https://nginx.org
  # 应用（这里是 nginx）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: BSD-2-Clause
  tags: { zh: [示例], en: [example] }
  about:
    zh: |
      插件模板里的示例：网关认出主人后，经请求头把用户名交给应用，网页上就是“你好，<用户名>”。
    en: |
      The example from the plugin template: once the gateway recognises the owner, it passes the user name to
      the app in a request header, and the page says hello to them.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: web
    port: 80
    # 应用不认 OIDC 时，由网关在请求上加上用户名（README 的“网页入口和登录”）。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  permissions: []
