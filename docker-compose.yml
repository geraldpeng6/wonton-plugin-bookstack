# BookStack 家庭 Wiki：书、章节、页面，所见即所得编辑和全文搜索。
# 登录用 BookStack 自己的账号（sso: none）：核心只签发 http 的 OIDC，BookStack 上游硬性要求 https
# 签发方（核心网关在隧道里不用 TLS），接不上，原因写在 README。管理员不设任何默认账密：
# init 一次性服务在首次启动时把它建成主人的邮箱 + 核心生成的随机密码，密码用密钥的 show_owner
# 显示在插件详情页（登录邮箱就是主人的云吞邮箱）。
# 上游文档指向的镜像是 linuxserver.io 打包的（BookStack 项目自己不发镜像），MIT 应用 + GPL-2.0 的 MariaDB 数据库，
# 都用上游官方镜像、按清单列表（index）的摘要固定。
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:v26.09.2-ls295@sha256:33f61a72d9aaa021f7e687987b9fcb992673d9ca3fc08f63f5ddaddf59e94efc
    # LinuxServer 镜像以 root 起初始化（迁移数据库、改属主）再降权到 PUID/PGID，数据目录归用户的用户。
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # 网页地址用核心注入的插件网页地址；应用生成的链接和回调地址都以它为准。
      APP_URL: ${WONTON_APP_URL}
      # 会话加密密钥由核心生成保管，保留数据重装沿用同一个值（换了它已有会话全部失效）。
      APP_KEY: base64:${WONTON_SECRET_APP_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      # 发信走核心的内部邮箱（notify 权限）：不认证、不加密、明文 25，收件人只能是家里人，信转进
      # 收件人的 Wonton 私聊。MAIL_ENCRYPTION 在这版 BookStack 只控制「要求 STARTTLS」，按上游文档
      # 写 null（明文）；这台服务器不宣告 STARTTLS，Symfony 传输层只在服务端宣告时才升级。用户名密码
      # 不填：服务器接受匿名，填了会在明文连接上 AUTH。
      MAIL_DRIVER: smtp
      MAIL_HOST: ${WONTON_SMTP_HOST}
      MAIL_PORT: ${WONTON_SMTP_PORT}
      MAIL_ENCRYPTION: "null"
      MAIL_FROM: ${WONTON_MAIL_FROM}
      # 界面默认中文，浏览器语言是英文的访客自己切。
      APP_LANG: zh_CN
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    healthcheck:
      # /status 是 BookStack 的就绪端点：连不上数据库或缓存时返回 500，只看进程活着时它也是 200。
      # 用 -T 而不是 --max-time：容器里的 wget 是 busybox 的，不认 curl 的选项。
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/status"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      start_interval: 5s
    restart: unless-stopped

  # 一次性服务：等应用健康（迁移已跑完）后初始化管理员。bookstack:create-admin --initial 的语义
  # 正合幂等要求：全新库直接创建；只有默认 admin@admin.com 时把它改成给定资料；已有非默认管理员
  # （保留数据重装、升级）时跳过（退出码 2），密码保持不变。所有非 0/2 的退出都让安装失败。
  # 以 root 跑（镜像的 /app/www/bootstrap/cache 只归 root 组，PUID 写不了；镜像官方的 artisan
  # 用法就是 root 的 docker exec）。成功路径只在镜像内的缓存目录写文件，/config 里落盘的只有头像。
  init:
    image: lscr.io/linuxserver/bookstack:v26.09.2-ls295@sha256:33f61a72d9aaa021f7e687987b9fcb992673d9ca3fc08f63f5ddaddf59e94efc
    depends_on:
      bookstack:
        condition: service_healthy
    # 镜像的入口是 s6 的 /init、工作目录是 /，跑 artisan 要覆盖入口并指到 webroot。
    entrypoint: ["sh", "-c"]
    working_dir: /app/www
    command:
      - |
        php artisan bookstack:create-admin --initial \
          --email="$$WONTON_OWNER_EMAIL" --name="$$WONTON_OWNER_NAME" --password="$$WONTON_SECRET_ADMIN_PASSWORD"
        rc=$$?
        [ "$$rc" = 0 ] || [ "$$rc" = 2 ] || exit "$$rc"
        # 邮箱即登录名。上游没有改用户邮箱的命令，走应用自己的 tinker（模型层）
        # 把管理员账号的邮箱对到当前云吞邮箱：0.11 之前装的实例里存的是当时填的旧邮箱，主人的用户名
        # 变过也一样。对齐只是顺手的事，不拦安装：只有一个管理员直接对；多个管理员先按 OIDC 的
        # external_auth_id（= 云吞用户名）认主人的账号，认不出就打一行日志跳过，主人可以在应用的
        # 「设置 - 用户」里手动改。已经是这个值就不动（幂等）。tinker --execute 里失败不能用裸 throw
        # （PsySH 吞掉异常、退出码是 0）：整段包进 try，catch 里 exit(1) 才能让安装失败；exit() 只能
        # 写在 catch 里——在 try 里调 exit() 抛出的 BreakException 会被这个 catch 捕住。成功路径自然结束。
        php artisan tinker --execute='
          try {
            $$admins = \BookStack\Users\Models\Role::getSystemRole("admin")->users;
            $$email = getenv("WONTON_OWNER_EMAIL");
            $$user = null;
            if ($$admins->count() === 1) {
              $$user = $$admins->first();
            } else {
              $$owner = (string) getenv("WONTON_OWNER_NAME");
              $$byOidc = $$admins->filter(function ($$u) use ($$owner) { return (string) $$u->external_auth_id === $$owner; });
              $$user = $$byOidc->count() === 1 ? $$byOidc->first() : null;
            }
            if ($$user === null) {
              echo "本次没有对齐管理员邮箱：应用里有 " . $$admins->count() . " 个管理员，认不出哪个是你的账号；请在应用的「设置 - 用户」里手动把账号邮箱改成 " . $$email . "（安装不受影响）\n";
            } elseif ($$user->email !== $$email) {
              $$user->email = $$email;
              $$user->save();
              echo "管理员邮箱已对到 " . $$email . "\n";
            }
          } catch (\Throwable $$e) {
            fwrite(STDERR, "对齐管理员邮箱失败：" . $$e->getMessage() . "\n");
            exit(1);
          }
        '
    environment:
      # 管理员登录用邮箱；内部邮箱由核心保证总有值，不用主人先填。
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # artisan 走同一套应用配置：应用密钥、数据库连接都要和主服务一致。
      APP_KEY: base64:${WONTON_SECRET_APP_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    restart: "no"

  db:
    image: mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WONTON_SECRET_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # ping 数据库本身，不只看进程；密码错时这里失败。
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      start_interval: 5s
    restart: unless-stopped

volumes:
  db-data:

x-wonton:
  spec: "0.11"
  id: app.bookstack.bookstack
  version: 0.2.0
  kind: app
  title: { en: BookStack }
  description:
    zh: "家里的 Wiki 和文档库：书、章节、页面，图文编辑，全文搜索。用 BookStack 自己的账号登录，不走云吞登录。"
    en: "Your home wiki and docs: books, chapters and pages with a rich editor and full-text search. Signs in with BookStack's own account, not the Wonton login."
  icon: icon.png
  notices: [NOTICE]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.bookstackapp.com
  # 应用（BookStack）的许可证；数据库 MariaDB（GPL-2.0）作为独立容器分发。
  license: MIT
  tags:
    zh: [文档]
    en: [Documents]
  about:
    zh: |
      把家里的知识整理成书：一本书分章节，章节里一页页写，所见即所得编辑，图片和附件直接贴进页面，之后全文搜索。

      用 BookStack 自己的账号登录，不走云吞登录。应用发的信（找回密码、新用户邀请、页面更新的关注通知）会出现在收件人的 Wonton 私聊里；外部邮箱收不到。
    en: |
      Organise your knowledge into books: chapters hold pages, editing is rich-text with images and attachments, and everything stays searchable.

      Signs in with BookStack's own account, not the Wonton login. Mail the app sends (password resets, user invites, watch notifications) lands in the recipient's Wonton chat; external addresses can't receive it.
  release_notes:
    zh: 应用发的信（找回密码、新用户邀请、页面关注通知）改走云吞内部邮箱，进收件人的 Wonton 私聊；重装时把管理员账号的邮箱对到云吞邮箱。
    en: Mail the app sends (password resets, user invites, watch notifications) now goes through the Wonton internal mailbox into the recipient's Wonton chat; reinstalling syncs the admin account's email to the Wonton address.
  webui:
    service: bookstack
    port: 80
    sso: none
  secrets:
    # 管理员密码：核心生成，详情页显示（show_owner），init 服务写进应用；保留数据重装沿用同一个值（密码不变）。
    admin_password:
      generate: { bytes: 32 }
      show_owner: { label: { zh: 管理员密码, en: Admin password } }
    # Laravel 会话加密密钥（APP_KEY），应用文档要求 base64 编码的 32 字节。
    app_key:
      generate: { bytes: 32, encoding: base64 }
    db_password:
      generate: { bytes: 32 }
    db_root_password:
      generate: { bytes: 32 }
  # owner.identity：管理员账号用主人的邮箱和用户名。notify：应用发信走核心的内部邮箱。
  permissions:
    - owner.identity
    - notify
  # 上游没写最低内存；BookStack + MariaDB 空闲实测约 350M（docker stats，验证时 v26.09.2-ls295），取 512M。
  # 两个镜像都有 amd64 和 arm64（docker buildx imagetools inspect）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
